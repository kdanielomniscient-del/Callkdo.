<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.D.O CALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121722; --panel:#1B2230; --panel-2:#232C3D; --line:#2C3545;
    --text:#F3EFE7; --muted:#8A93A6; --amber:#E8A33D; --amber-deep:#C9872A;
    --call:#E8603C; --bubble-me:#3A4A3E; --bubble-them:#232C3D;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
    height:100vh;height:100dvh;overflow:hidden;display:flex;justify-content:center}
  #app{width:100%;max-width:460px;height:100%;background:var(--bg);position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .32s cubic-bezier(.22,.9,.3,1);background:var(--bg)}
  .screen.active{transform:translateX(0)}
  .auth{justify-content:center;align-items:center;padding:36px 28px;gap:22px;text-align:center}
  .gift-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--amber),var(--amber-deep));
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 30px -8px rgba(232,163,61,.5)}
  .auth h1{font-family:'Fraunces',serif;font-size:28px;margin:0}
  .auth p.sub{color:var(--muted);margin:-6px 0 4px;font-size:14.5px;line-height:1.5;max-width:320px}
  .field{width:100%;text-align:left}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15.5px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--amber)}
  .form-stack{width:100%;display:flex;flex-direction:column;gap:14px}
  .btn{width:100%;padding:14px;border-radius:14px;border:none;font-size:15.5px;font-weight:600;
    font-family:inherit;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--amber);color:#1B1507}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .hint{font-size:13px;color:var(--muted)}
  .hint b{color:var(--amber);cursor:pointer}
  .error{color:var(--call);font-size:13px;min-height:16px}

  .topbar{padding:16px 18px;display:flex;align-items:center;gap:12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .topbar .gift-mark{width:34px;height:34px;border-radius:10px;font-size:16px}
  .topbar h2{font-family:'Fraunces',serif;font-size:19px;margin:0}
  .topbar .status{font-size:11.5px;color:var(--amber);margin-top:1px}
  .list{overflow-y:auto;flex:1;padding:6px 10px}
  .convo{display:flex;align-items:center;gap:13px;padding:12px 10px;border-radius:14px;cursor:pointer}
  .convo:active{background:var(--panel)}
  .avatar{width:50px;height:50px;border-radius:50%;flex-shrink:0;object-fit:cover;
    background:var(--amber-deep);display:flex;align-items:center;justify-content:center;font-weight:700}
  .convo .meta{flex:1;min-width:0}
  .convo .top-row{display:flex;justify-content:space-between;align-items:baseline}
  .convo .top-row b{font-size:15.5px}
  .convo .top-row span{font-size:11.5px;color:var(--muted)}
  .convo .preview{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .fab{position:absolute;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;
    background:var(--call);border:none;color:#fff;font-size:22px;box-shadow:0 10px 26px -6px rgba(232,96,60,.6)}
  .empty{color:var(--muted);text-align:center;margin-top:60px;font-size:14px;padding:0 30px}

  .chat-top{display:flex;align-items:center;gap:12px;padding:14px 14px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .chat-top .back{background:none;border:none;color:var(--amber);font-size:20px;padding:4px}
  .chat-top .avatar{width:38px;height:38px;font-size:14px}
  .chat-top b{font-size:15.5px;display:block}
  .messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
  .bubble{max-width:75%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.4}
  .bubble.them{background:var(--bubble-them);align-self:flex-start;border-bottom-left-radius:4px}
  .bubble.me{background:var(--bubble-me);align-self:flex-end;border-bottom-right-radius:4px}
  .composer{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);
    align-items:center;flex-shrink:0}
  .composer input[type=text]{flex:1;padding:12px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:14.5px;font-family:inherit;min-width:0}
  .composer input:focus{outline:none;border-color:var(--amber)}
  .composer button{width:42px;height:42px;border-radius:50%;border:none;background:var(--amber);
    color:#1B1507;font-size:17px;flex-shrink:0}
  .composer .attach{background:var(--panel-2);color:var(--amber);font-size:19px}
  .composer input[type=file]{display:none}
  .bubble img{max-width:100%;border-radius:12px;display:block}
  .bubble.img-bubble{padding:4px}

  .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;
    justify-content:center;z-index:10;padding:24px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border-radius:16px;padding:22px;width:100%;display:flex;
    flex-direction:column;gap:14px}
  .modal h3{margin:0;font-family:'Fraunces',serif}
  ::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="screen-signup">
    <div class="auth">
      <div class="gift-mark">🎁</div>
      <h1>K.D.O CALL</h1>
      <p class="sub">Discute avec tes proches partout dans le monde, en direct.</p>
      <div class="form-stack">
        <div class="field"><label>Prénom</label><input id="su-first" placeholder="Ex. Daniel"></div>
        <div class="field"><label>Nom</label><input id="su-last" placeholder="Ex. Omniscient"></div>
        <div class="field"><label>Numéro de téléphone</label><input id="su-phone" type="tel" placeholder="+228 90 00 00 00"></div>
        <p class="error" id="su-error"></p>
        <button class="btn btn-primary" onclick="doSignup()">Créer mon compte</button>
      </div>
      <p class="hint">Déjà inscrit ? <b onclick="show('screen-list')">Ouvrir l'appli</b></p>
    </div>
  </div>

  <div class="screen" id="screen-list">
    <div class="topbar">
      <div class="gift-mark">🎁</div>
      <div>
        <h2>K.D.O CALL</h2>
        <div class="status" id="welcome-line">Bienvenue</div>
      </div>
    </div>
    <div class="list" id="convo-list"></div>
    <button class="fab" onclick="openNewChatModal()">＋</button>
  </div>

  <div class="screen" id="screen-chat">
    <div class="chat-top">
      <button class="back" onclick="show('screen-list')">←</button>
      <div class="avatar" id="chat-avatar"></div>
      <div><b id="chat-name"></b></div>
    </div>
    <div class="messages" id="chat-messages"></div>
    <div class="composer">
      <button class="attach" onclick="document.getElementById('photo-input').click()">📷</button>
      <input type="file" id="photo-input" accept="image/*" onchange="sendPhoto(event)">
      <input type="text" id="chat-input" placeholder="Écris un message…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>

  <div class="modal-bg" id="modal-newchat">
    <div class="modal">
      <h3>Nouvelle discussion</h3>
      <div class="field"><label>Numéro de téléphone de ton ami</label><input id="nc-phone" type="tel" placeholder="+228 ..."></div>
      <p class="error" id="nc-error"></p>
      <button class="btn btn-primary" onclick="startNewChat()">Commencer la discussion</button>
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAcvE6gvwTayul-cqKbUYXxLD71-j2oU0k",
  authDomain: "kdo-call.firebaseapp.com",
  projectId: "kdo-call",
  storageBucket: "kdo-call.firebasestorage.app",
  messagingSenderId: "1020713798182",
  appId: "1:1020713798182:web:3dc9a065a33e027d10b4e7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let me = JSON.parse(localStorage.getItem('kdo-user') || 'null');
let currentRoom = null, currentPeer = null, unsub = null;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-list') loadConversations();
}

function cleanPhone(p){ return p.replace(/[^\d+]/g,''); }
function roomId(a,b){ return [cleanPhone(a),cleanPhone(b)].sort().join('_'); }
function initials(name){ return (name||'?').slice(0,1).toUpperCase(); }

async function doSignup(){
  const first = document.getElementById('su-first').value.trim();
  const last = document.getElementById('su-last').value.trim();
  const phoneRaw = document.getElementById('su-phone').value.trim();
  const err = document.getElementById('su-error');
  err.textContent = '';
  if(!first || !last || !phoneRaw){ err.textContent = "Remplis tous les champs pour continuer."; return; }
  const phone = cleanPhone(phoneRaw);
  me = { first, last, phone, name: first + ' ' + last };
  localStorage.setItem('kdo-user', JSON.stringify(me));
  try{
    await db.collection('users').doc(phone).set(me, {merge:true});
  }catch(e){ err.textContent = "Connexion à Firebase impossible : " + e.message; return; }
  document.getElementById('welcome-line').textContent = `Connecté en tant que ${first}`;
  show('screen-list');
}

function openNewChatModal(){
  document.getElementById('nc-error').textContent = '';
  document.getElementById('nc-phone').value = '';
  document.getElementById('modal-newchat').classList.add('show');
}
function closeModal(){ document.getElementById('modal-newchat').classList.remove('show'); }

async function startNewChat(){
  const phoneRaw = document.getElementById('nc-phone').value.trim();
  const err = document.getElementById('nc-error');
  if(!phoneRaw){ err.textContent = "Entre le numéro de ton ami."; return; }
  const phone = cleanPhone(phoneRaw);
  if(phone === me.phone){ err.textContent = "C'est ton propre numéro !"; return; }
  let name = phone;
  try{
    const udoc = await db.collection('users').doc(phone).get();
    if(udoc.exists) name = udoc.data().name;
  }catch(e){}
  closeModal();
  openChat(phone, name);
}

async function loadConversations(){
  const el = document.getElementById('convo-list');
  if(!me){ show('screen-signup'); return; }
  try{
    const snap = await db.collection('rooms').where('members','array-contains', me.phone).get();
    if(snap.empty){
      el.innerHTML = `<div class="empty">Aucune discussion pour l'instant.<br>Appuie sur ＋ pour écrire à un ami.</div>`;
      return;
    }
    const rows = [];
    snap.forEach(doc=>{
      const d = doc.data();
      const peerPhone = d.members.find(p => p !== me.phone);
      const peerName = (d.names && d.names[peerPhone]) || peerPhone;
      rows.push({peerPhone, peerName, last: d.lastMessage || '', time: d.lastTime || ''});
    });
    el.innerHTML = rows.map(r => `
      <div class="convo" onclick="openChat('${r.peerPhone}','${r.peerName.replace(/'/g,"")}')">
        <div class="avatar">${initials(r.peerName)}</div>
        <div class="meta">
          <div class="top-row"><b>${r.peerName}</b></div>
          <div class="preview">${r.last}</div>
        </div>
      </div>`).join('');
  }catch(e){
    el.innerHTML = `<div class="empty">Impossible de charger les discussions.<br>${e.message}</div>`;
  }
}

function openChat(peerPhone, peerName){
  currentPeer = {phone:peerPhone, name:peerName};
  currentRoom = roomId(me.phone, peerPhone);
  document.getElementById('chat-name').textContent = peerName;
  document.getElementById('chat-avatar').textContent = initials(peerName);
  show('screen-chat');

  if(unsub) unsub();
  const box = document.getElementById('chat-messages');
  box.innerHTML = '<div class="empty">Chargement…</div>';
  unsub = db.collection('rooms').doc(currentRoom).collection('messages')
    .orderBy('ts','asc')
    .onSnapshot(snap=>{
      const msgs = [];
      snap.forEach(d=> msgs.push(d.data()));
      box.innerHTML = msgs.length ? msgs.map(m=>
        m.type === 'image'
          ? `<div class="bubble img-bubble ${m.from===me.phone?'me':'them'}"><img src="${m.data}"></div>`
          : `<div class="bubble ${m.from===me.phone?'me':'them'}">${escapeHtml(m.text)}</div>`
      ).join('') : '<div class="empty">Dis bonjour 👋</div>';
      box.scrollTop = box.scrollHeight;
    }, err=>{
      box.innerHTML = `<div class="empty">Erreur de connexion : ${err.message}</div>`;
    });
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

async function sendMsg(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || !currentRoom) return;
  input.value = '';
  const roomRef = db.collection('rooms').doc(currentRoom);
  await roomRef.set({
    members: [me.phone, currentPeer.phone],
    names: { [me.phone]: me.name, [currentPeer.phone]: currentPeer.name },
    lastMessage: text,
    lastTime: new Date().toISOString()
  }, {merge:true});
  await roomRef.collection('messages').add({
    from: me.phone, text, ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function sendPhoto(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file || !currentRoom) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = async function(){
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      const roomRef = db.collection('rooms').doc(currentRoom);
      await roomRef.set({
        members: [me.phone, currentPeer.phone],
        names: { [me.phone]: me.name, [currentPeer.phone]: currentPeer.name },
        lastMessage: '📷 Photo',
        lastTime: new Date().toISOString()
      }, {merge:true});
      await roomRef.collection('messages').add({
        from: me.phone, type: 'image', data: dataUrl, ts: firebase.firestore.FieldValue.serverTimestamp()
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

if(me){ document.getElementById('welcome-line').textContent = `Connecté en tant que ${me.first}`; show('screen-list'); }
</script>
</body>
</html>
